<body>

                            class="w-full md:h-66 h-40 object-cover transition-transform duration-500 group-hover:scale-110">
                    </div> -->

                    <div class="gallery-item-full overflow-hidden rounded-xl cursor-pointer group opacity-0 translate-y-4 animate-fade-in-gallery"
                        style="animation-delay: 0.4s;" data-full="./docs/assets/gallery/ice-village.jpg">

                    </div>

                    <div class="gallery-item-full overflow-hidden rounded-xl cursor-pointer group opacity-0 translate-y-4 animate-fade-in-gallery"
                        style="animation-delay: 0.45s;" data-full="./docs/assets/gallery/icebar.jpg">
                        <img src="./docs/assets/gallery/icebar.jpg" alt="Living room view"

                    <div class="gallery-item-full overflow-hidden rounded-xl cursor-pointer group opacity-0 translate-y-4 animate-fade-in-gallery"

                    <div class="gallery-item-full overflow-hidden rounded-xl cursor-pointer group opacity-0 translate-y-4 animate-fade-in-gallery"

                    <div class="gallery-item-full overflow-hidden rounded-xl cursor-pointer group opacity-0 translate-y-4 animate-fade-in-gallery"

                            class="w-full md:h-66 h-40 object-cover transition-transform duration-500 group-hover:scale-110">
                    </div>
                </div>

            </div>

            <div id="lightbox-gallery"
                class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/0 transition-colors duration-300">
                <button id="lightbox-gallery-close"
                    class="absolute top-6 right-6 text-white text-3xl w-11 h-11 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors duration-200">&times;</button>
                <img id="lightbox-gallery-img" src="" alt=""
                    class="max-w-[90vw] max-h-[85vh] rounded-lg object-contain scale-90 opacity-0 transition-all duration-300 shadow-2xl">
            </div>
        </section>

        <style>
            @keyframes fadeInUpGallery {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .animate-fade-in-gallery {
                animation: fadeInUpGallery 0.6s ease forwards;
            }

            .gallery-item-full {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .gallery-item-full:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 28px rgba(7, 43, 94, 0.2);
            }

            #lightbox-gallery.active {
                background-color: rgba(0, 0, 0, 0.85);
            }

            #lightbox-gallery.active #lightbox-gallery-img {
                transform: scale(1);
                opacity: 1;
            }
        </style>

        <script>
            const galleryFullItems = document.querySelectorAll('.gallery-item-full');
            const lightboxGallery = document.getElementById('lightbox-gallery');
            const lightboxGalleryImg = document.getElementById('lightbox-gallery-img');
            const lightboxGalleryClose = document.getElementById('lightbox-gallery-close');

            function openGalleryLightbox(src) {
                lightboxGalleryImg.src = src;
                lightboxGallery.classList.remove('hidden');
                lightboxGallery.classList.add('flex');
                requestAnimationFrame(() => {
                    lightboxGallery.classList.add('active');
                });
                document.body.style.overflow = 'hidden';
            }

            function closeGalleryLightbox() {
                lightboxGallery.classList.remove('active');
                document.body.style.overflow = '';
                setTimeout(() => {
                    lightboxGallery.classList.add('hidden');
                    lightboxGallery.classList.remove('flex');
                    lightboxGalleryImg.src = '';
                }, 300);
            }

            galleryFullItems.forEach(item => {
                item.addEventListener('click', () => {
                    openGalleryLightbox(item.getAttribute('data-full'));
                });
            });

            lightboxGalleryClose.addEventListener('click', closeGalleryLightbox);
            lightboxGallery.addEventListener('click', (e) => {
                if (e.target === lightboxGallery) closeGalleryLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeGalleryLightbox();
            });
        </script>


        <section class="md:pb-24 pb-16 md:pt-0 pt-8 bg-white">
            <div class="max-w-7xl mx-auto px-6 lg:px-8">

                                Every season. Every view. Every memory.

                            </h2>

                            <p class="mt-2 text-gray-600">
                                Tomamu is unforgettable. </p>

                        </div>

                    </div>

                    <a href="#" onclick="openBookingModal(); return false;"
                        class="group/button inline-flex w-full md:w-auto items-center justify-center bg-[#072b5e] hover:bg-[#214A86] text-white px-8 py-3.5 rounded-lg transition-all duration-500 hover:shadow-xl hover:scale-105">

                        BOOK NOW

                        <i
                            class="fa-solid fa-arrow-right ml-3 transition-transform duration-500 group-hover/button:translate-x-2"></i>

                    </a>

                </div>
